name: Sync RustSec Advisory-DB to GitHub

on:
  schedule:
    - cron: '0 0 * * 1' # 每周一的 00:00 触发一次
  workflow_dispatch:

# 核心：必须显式声明允许写入仓库内容的权限
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Pull upstream and merge (preserving .github)
        run: |
          # 1. 添加上游仓库地址并拉取
          git remote add upstream https://github.com/rustsec/advisory-db.git
          git fetch upstream

          # 2. 合并上游 main 分支（--no-commit：先停住，处理完 .github 再提交）
          git merge upstream/main --allow-unrelated-histories --no-edit --no-commit || true

          # 3. 以 HEAD 为准还原 .github：撤销上游对该目录的新增/修改/冲突
          git rm -rq --cached .github 2>/dev/null || true
          rm -rf .github
          git checkout HEAD -- .github 2>/dev/null || true

          # 4. 完成合并提交（Already up to date 时跳过）
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          else
            echo 'Already up to date, nothing to merge'
          fi

          # 5. 提交并推送到你的 GitHub 仓库（带上认证 Token）
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin main