name: Sync RustSec Advisory-DB to GitHub

on:
  # 每个月的第一天 00:00 UTC 触发一次（约北京时间早上 8 点）
  schedule:
    - cron: '0 0 1 * *'

  # 允许你在 GitHub 仓库的 Actions 页面手动点击按钮随时触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync upstream advisory-db
        uses: dabreadman/sync-git-repo-action@v1.3.0
        with:
          source_repo: 'https://github.com/rustsec/advisory-db.git'
          source_branch: 'main'
          destination_branch: 'main'
          github_token: ${{ secrets.GITHUB_TOKEN }}