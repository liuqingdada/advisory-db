name: Sync RustSec Advisory-DB to GitHub

on:
  schedule:
    - cron: '0 0 * * 1' # 每周一的 00:00 触发一次
  workflow_dispatch:

# 核心：必须显式声明允许写入仓库内容的权限
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Pull upstream and merge (preserving .github)
        run: |
          # 1. 添加上游仓库地址并拉取
          git remote add upstream https://github.com/rustsec/advisory-db.git
          git fetch upstream

          # 2. 以合并的方式拉取上游 main 分支
          git merge upstream/main --allow-unrelated-histories --no-edit

          # 3. 保护本地 .github 文件夹，防止被上游覆盖
          git checkout HEAD -- .github

          # 4. 提交并推送到你的 GitHub 仓库（带上认证 Token）
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin main