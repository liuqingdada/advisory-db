name: Sync RustSec Advisory-DB to GitHub

on:
  schedule:
    - cron: '0 0 1 * *' # 每个月第一天触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull upstream and exclude .github
        uses: repo-sync/github-sync@v2
        with:
          source_repo: 'https://github.com/rustsec/advisory-db.git'
          source_branch: 'main'
          destination_branch: 'main'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 核心参数：同步时排除 .github 文件夹，保护你的 sync.yml
          exclude: ".github/*"